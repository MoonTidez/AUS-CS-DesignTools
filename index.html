<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Tools — Career Services</title>
<link rel="stylesheet" href="lib/brand.css">
<style>
/* Home only — shared styles live in lib/brand.css. */
.landing{max-width:1080px;margin:0 auto;padding:var(--space-6) var(--space-5)}
.landing h1{
  margin:0 0 var(--space-2);
  font-family:var(--font-mono);font-size:11px;font-weight:500;
  letter-spacing:.11em;text-transform:uppercase;color:var(--color-muted);
}
.landing .lede{margin:0 0 var(--space-5);font-size:13px;color:var(--color-muted);max-width:60ch}

.cards{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--color-line-strong)}
.card{
  display:flex;flex-direction:column;gap:var(--space-3);min-height:260px;
  padding:var(--space-4);color:var(--color-text);text-decoration:none;
  background-color:var(--color-surface);
}
.card+.card{border-left:1px solid var(--color-line-strong)}
.card .kind{
  font-family:var(--font-mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--color-muted);display:flex;gap:var(--space-2)
}
.card .kind em{font-style:normal;color:var(--color-accent)}
.card .name{font-size:22px;font-weight:500;line-height:1.15}
.card .blurb{font-size:13px;color:var(--color-muted);flex:1}
.card .go{
  align-self:flex-start;
  font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  padding:7px var(--space-3);border:1px solid var(--color-text);
}
/* Whole card inverts on hover, matching the selected-state rule. */
.card:hover{background:var(--color-text);color:var(--white)}
.card:hover .kind,.card:hover .blurb{color:var(--color-line)}
.card:hover .go{border-color:var(--white);background:var(--white);color:var(--color-text)}
.card:focus-visible{outline:2px solid var(--color-accent);outline-offset:-2px}

.foot{margin-top:var(--space-4);font-family:var(--font-mono);font-size:11px;color:var(--color-muted)}
</style>
</head>
<body>

<header class="masthead">
  <span>Career Services</span>
  <span class="arrow">&#8594;</span>
  <span>Design Tools</span>
  <span class="spacer"></span>
  <span class="dim" id="buildStamp">Build 1</span>
</header>

<main class="landing">
  <h1>Design Tools</h1>
  <p class="lede">Pick a tool. Everything runs in your browser &#8212; nothing is uploaded.</p>
  <div class="cards" id="cards"></div>
  <p class="foot">Use the tabs at the top of any tool to switch, or &#8220;Career Services&#8221; to come back here.</p>
</main>

<script src="lib/licences.js"></script>
<script src="lib/brand.js"></script>
<script>
/* Cards come from CS.TOOLS, the same list that drives the masthead tabs. */
const cards = CS.$('cards');
CS.TOOLS.forEach(t => {
  const a = document.createElement('a');
  a.className = 'card'; a.href = t.href;
  const kind = document.createElement('span'); kind.className = 'kind'; kind.textContent = t.kind;
  if (t.note) { const n = document.createElement('em'); n.textContent = t.note; kind.appendChild(n); }
  const name = document.createElement('span'); name.className = 'name'; name.textContent = t.name;
  const blurb = document.createElement('span'); blurb.className = 'blurb'; blurb.textContent = t.blurb;
  const go = document.createElement('span'); go.className = 'go'; go.textContent = 'Open →';
  a.append(kind, name, blurb, go);
  cards.appendChild(a);
});
CS.toolNav('');
CS.initLicences('Career Services Design Tools');
</script>
</body>
</html>
