/* ============================================================
   TOKENS — every brand value lives here and nowhere else.
   ============================================================ */
:root{
  /* Core brand palette */
  --anchor-blue:#307FE2;
  --link-pink:#EB6FBD;
  --open-mint:#47D7AC;
  --signal-yellow:#E3E935;
  --bright-orange:#EE5340;
  --framework-gray:#B2B4B2;
  --light-concrete:#D9D9D6;
  --core-black:#1E2021;
  --white:#FFFFFF;

  /* UI roles */
  --color-bg:var(--white);
  --color-surface:var(--white);
  --color-sunk:#F4F4F2;
  --color-text:var(--core-black);
  --color-muted:#6E7273;
  --color-line:var(--light-concrete);
  --color-line-strong:var(--core-black);
  --color-accent:var(--anchor-blue);
  --color-warn:#8A3A2C;
  --color-warn-bg:#FDEDEA;

  --font-ui:"Uncut Sans",system-ui,sans-serif;
  --font-mono:"Geist Mono",ui-monospace,monospace;

  --radius-control:0;
  --track:1px;
  --thumb:12px;

  --space-1:4px;
  --space-2:8px;
  --space-3:12px;
  --space-4:20px;
  --space-5:32px;
  --space-6:48px;

  --ease-snap:cubic-bezier(.2,0,0,1);
  --dur:120ms;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--font-ui);
  font-size:13px;
  line-height:1.45;
  color:var(--color-text);
  background:var(--color-bg);
  -webkit-font-smoothing:antialiased;
}
[hidden]{display:none !important}

/* ---- masthead: mirrors the deck's running header ---- */
.masthead{
  display:flex;align-items:center;gap:var(--space-3);
  height:34px;padding:0 var(--space-4);
  border-bottom:1px solid var(--color-line-strong);
  font-family:var(--font-mono);font-size:11px;font-weight:500;
  letter-spacing:.09em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;
}
.masthead .arrow{color:var(--color-muted)}
.masthead .spacer{flex:1}
.masthead .dim{color:var(--color-muted)}

.app{display:grid;grid-template-columns:316px 1fr;height:calc(100vh - 34px)}

/* ---- panel ---- */
.panel{
  background:var(--color-surface);
  border-right:1px solid var(--color-line-strong);
  overflow-y:auto;
}
.group{padding:var(--space-4);border-bottom:1px solid var(--color-line)}
.group:last-child{border-bottom:0}
.group>h2{
  margin:0 0 var(--space-3);
  font-family:var(--font-mono);font-size:10px;font-weight:500;
  letter-spacing:.11em;text-transform:uppercase;color:var(--color-muted);
}

/* ---- drop zone ---- */
.drop{
  position:relative;
  border:1px solid var(--color-line-strong);
  padding:var(--space-5) var(--space-3);
  text-align:center;cursor:pointer;color:var(--color-muted);
  background-color:var(--color-surface);
  background-image:
    linear-gradient(var(--color-line) 1px,transparent 1px),
    linear-gradient(90deg,var(--color-line) 1px,transparent 1px);
  background-size:14px 14px;background-position:center;
}
.drop:hover,.drop.over{border-color:var(--color-accent);color:var(--color-accent)}
.drop.over{background-color:var(--color-sunk)}
.drop strong{display:block;color:var(--color-text);font-weight:500}
.drop span{position:relative;background:var(--color-surface);padding:0 var(--space-2)}
.filemeta{margin-top:var(--space-2);font-family:var(--font-mono);font-size:11px;color:var(--color-muted)}
.filemeta b{color:var(--color-text);font-weight:500}

/* ---- fields ---- */
.field{margin-bottom:var(--space-4)}
.field:last-child{margin-bottom:0}
.field-head{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-2);margin-bottom:var(--space-2)}
.field-head label{font-size:12px}
.readout{
  font-family:var(--font-mono);font-size:11px;color:var(--color-text);
  white-space:nowrap;font-variant-numeric:tabular-nums;
}
.readout em{font-style:normal;color:var(--color-muted)}

/* ---- slider: 1px rule, square thumb, filled left half ---- */
.slider{position:relative;height:18px;display:flex;align-items:center}
.slider::before{
  content:"";position:absolute;left:0;right:0;height:var(--track);
  background:var(--color-line);
}
.slider::after{
  content:"";position:absolute;left:0;height:var(--track);
  width:var(--fill,0%);background:var(--color-text);
}
.slider input[type=range]{
  -webkit-appearance:none;appearance:none;position:relative;
  width:100%;height:18px;margin:0;background:transparent;cursor:pointer;
}
.slider input[type=range]::-webkit-slider-runnable-track{height:var(--track);background:transparent}
.slider input[type=range]::-moz-range-track{height:var(--track);background:transparent}
.slider input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:var(--thumb);height:var(--thumb);
  margin-top:calc((var(--thumb) / -2) + (var(--track) / 2));
  background:var(--color-text);border:0;border-radius:0;
}
.slider input[type=range]::-moz-range-thumb{
  width:var(--thumb);height:var(--thumb);background:var(--color-text);
  border:0;border-radius:0;
}
.slider input[type=range]:focus-visible::-webkit-slider-thumb{outline:2px solid var(--color-accent);outline-offset:2px}
.slider.disabled{opacity:.35;pointer-events:none}

/* ---- segmented ---- */
.seg{display:flex;border:1px solid var(--color-line-strong)}
.seg button{
  flex:1;border:0;background:var(--color-surface);color:var(--color-muted);
  font:inherit;font-size:12px;padding:6px var(--space-2);cursor:pointer;
  border-radius:0;
}
.seg button+button{border-left:1px solid var(--color-line-strong)}
.seg button[aria-pressed=true]{background:var(--color-text);color:var(--white)}
.seg.mini{width:72px}
.seg.mini button{font-family:var(--font-mono);font-size:10px;padding:2px var(--space-2)}

/* ---- toggle: rectangle, square knob, snap ease ---- */
.toggle{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3)}
.toggle label{font-size:12px}
.switch{
  width:34px;height:18px;flex:none;padding:0;position:relative;cursor:pointer;
  border:1px solid var(--color-line-strong);background:var(--color-surface);border-radius:0;
}
.switch::after{
  content:"";position:absolute;top:1px;left:1px;width:14px;height:14px;
  background:var(--color-text);
  transition:transform var(--dur) var(--ease-snap),background var(--dur) var(--ease-snap);
}
.switch[aria-pressed=true]{background:var(--color-text);border-color:var(--color-text)}
.switch[aria-pressed=true]::after{transform:translateX(16px);background:var(--white)}
.switch:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}

/* ---- swatches ---- */
.swatch-head{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:var(--space-2);
}
.swatch-name{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-muted)}
.swatches{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.swatches button{
  aspect-ratio:1;padding:0;cursor:pointer;border-radius:0;
  border:1px solid var(--color-line);
  position:relative;
}
.swatches button[aria-pressed=true]{outline:1px solid var(--color-text);outline-offset:2px}
.swatches button[disabled]{cursor:not-allowed;opacity:.25}
.swatches button.transparent{
  background-image:linear-gradient(45deg,var(--color-line) 25%,transparent 25%,transparent 75%,var(--color-line) 75%),
                   linear-gradient(45deg,var(--color-line) 25%,transparent 25%,transparent 75%,var(--color-line) 75%);
  background-size:8px 8px;background-position:0 0,4px 4px;background-color:var(--white);
}
.palette-label{
  font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--color-muted);margin:var(--space-3) 0 var(--space-2);
}
.palette-label:first-child{margin-top:0}

/* ---- stage ---- */
.stage{display:flex;flex-direction:column;min-width:0}
.stage-bar{
  display:flex;align-items:center;gap:var(--space-4);
  padding:var(--space-3) var(--space-4);
  border-bottom:1px solid var(--color-line);
}
.stage-bar .spacer{flex:1}
.stat{font-family:var(--font-mono);font-size:11px;color:var(--color-muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat b{color:var(--color-text);font-weight:500}

button.action{
  font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  padding:7px var(--space-3);border-radius:0;
  border:1px solid var(--color-text);background:var(--color-text);color:var(--white);cursor:pointer;
}
button.action.ghost{background:var(--color-surface);color:var(--color-text)}
button.action:disabled{opacity:.3;cursor:default}
button.action:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}

.viewport{flex:1;min-height:0;display:grid;place-items:center;padding:var(--space-5);overflow:auto}
#preview{max-width:100%;max-height:100%;outline:1px solid var(--color-line)}
.empty{color:var(--color-muted);text-align:center;max-width:34ch;font-size:12px}

.notice{
  padding:var(--space-2) var(--space-3);
  background:var(--color-warn-bg);color:var(--color-warn);font-size:11px;
  font-family:var(--font-mono);line-height:1.5;
}
.group .notice{margin-top:var(--space-2)}
.stage .notice{margin:var(--space-3) var(--space-4) 0}

@media (max-width:860px){
  .app{grid-template-columns:1fr;height:auto}
  .panel{border-right:0;border-bottom:1px solid var(--color-line-strong);order:2}
  .stage{order:1;height:60vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<header class="masthead">
  <span>Career Services</span>
  <span class="arrow">&#8594;</span>
  <span>Grid Raster</span>
  <span class="spacer"></span>
  <span class="dim" id="buildStamp">Build 8</span>
</header>

<div class="app">
  <aside class="panel">

    <section class="group">
      <h2>Source</h2>
      <div class="drop" id="drop" tabindex="0" role="button">
        <strong>Drop an image</strong>
        <span>paste, or click to browse</span>
      </div>
      <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden>
      <div class="filemeta" id="filemeta" hidden></div>
      <div class="notice" id="fileError" hidden></div>
    </section>

    <section class="group">
      <h2>Raster</h2>
      <div class="seg" id="glyphMode">
        <button data-v="plus" aria-pressed="true">Node</button>
        <button data-v="square" aria-pressed="false">Grid</button>
      </div>
      <div class="field toggle" id="flushField" hidden style="margin-top:var(--space-3)">
        <label for="squareFlush">Fill cell at black</label>
        <button class="switch" id="squareFlush" aria-pressed="false" aria-label="Fill cell at black"></button>
      </div>
    </section>

    <section class="group">
      <h2>Output</h2>
      <div class="field">
        <div class="field-head"><label>Mode</label></div>
        <div class="seg" id="mode">
          <button data-v="bw" aria-pressed="false">Black &amp; white</button>
          <button data-v="gray" aria-pressed="true">Grayscale</button>
        </div>
      </div>
      <div class="field" id="thresholdField" hidden>
        <div class="field-head">
          <label for="threshold">Threshold</label>
          <span class="readout" id="thresholdOut">50%</span>
        </div>
        <div class="slider"><input type="range" id="threshold" min="0" max="100" step="1" value="50"></div>
      </div>
    </section>

    <section class="group">
      <h2>Scale</h2>

        <div class="field-head">

          <div class="seg mini" id="scaleMode">
            <button data-v="pct" aria-pressed="true">%</button>
            <button data-v="px" aria-pressed="false">px</button>
          </div>
        </div>
        <div class="slider disabled" id="scaleWrap"><input type="range" id="scale" min="5" max="100" step="1" value="25" disabled></div>

          <span class="readout" id="contrastOut">0</span>

        <div class="field-head">
          <label for="gamma">Gamma</label>
          <span class="readout" id="gammaOut">1.00</span>
        </div>
        <div class="slider"><input type="range" id="gamma" min="0" max="1000" step="1" value="500"></div>
      </div>
      <div class="field toggle">
        <label for="invert">Invert</label>
        <button class="switch" id="invert" aria-pressed="false" aria-label="Invert"></button>

    <section class="group">
      <h2>Colour</h2>
      <div class="field">
        <div class="swatch-head">
          <label>Raster</label>
          <span class="swatch-name" id="inkName">Core Black</span>
        </div>
        <div class="palette-label">Core brand</div>
        <div class="swatches" id="inkCore"></div>
        <div class="palette-label">AUS</div>
        <div class="swatches" id="inkAus"></div>
      </div>
      <div class="field">
        <div class="swatch-head">
          <label>Background</label>
          <span class="swatch-name" id="bgName">White</span>
        </div>
        <div class="palette-label">Core brand</div>

        <div class="palette-label">AUS</div>

      <h2>Export</h2>
      <div class="field">
        <div class="field-head"><label>PNG resolution</label></div>
        <div class="seg" id="pngIntent">
          <button data-v="screen" aria-pressed="false">Screen</button>
          <button data-v="print" aria-pressed="true">Print</button>
          <button data-v="max" aria-pressed="false">Max</button>

  </aside>

  <main class="stage">
    <div class="stage-bar">
      <span class="stat" id="statGrid">&#8212;</span>
      <span class="stat" id="statBoard"></span>
      <span class="stat" id="statCells"></span>
      <span class="spacer"></span>
      <button class="action ghost" id="exportPng" disabled>PNG</button>
      <button class="action" id="exportSvg" disabled>SVG</button>
    </div>
    <div class="notice" id="stageNotice" hidden></div>
    <div class="viewport">
      <canvas id="preview" hidden></canvas>
      <p class="empty" id="emptyState">Drop an image to build a raster. Nothing leaves this page &#8212; all processing is local.</p>
    </div>
  </main>
</div>

<script>
/* ============================================================================
   Grid Raster — Department of Career Services
   Single file, fully client-side. Logic below is grouped into the sections a
   module split would follow: geometry / sampler / render / svg / png / ui.
   ========================================================================= */

/* ---- constants (tune here, not in the UI) ------------------------------- */
const PT_MM         = 25.4 / 72;
const B_MM          = 8;
const GAP_RATIO     = 0.25;
const PITCH         = B_MM * (1 + GAP_RATIO);
const BG_TAPER_T    = 0.3125;
const FG_STROKE_PT  = 1;
const BG_STROKE_PT  = 0.25;
const FG_MAX_MM     = B_MM;
const T_MIN         = 0.02;
const MAX_GRID_SHORT = 400;
const QUANT_MM      = 0.005;
const SQ_CELL_MM    = 9;
const SQ_GAP_MAX_MM = 8;
const PNG_MAX_PX    = 8192;
const PNG_DPI       = { screen: 150, print: 300 };
const PNG_SOFT_PX   = 1.5;         // thinnest feature below this reads soft
const CONTRAST_MIN  = 0.18;

const pitchFor = glyph => glyph === 'square' ? SQ_CELL_MM : PITCH;
const squareMax = flush => flush ? SQ_CELL_MM : SQ_GAP_MAX_MM;

/* ---- palettes ----------------------------------------------------------- */
const CORE = [
  { name:'Core Black',      hex:'#1E2021' },
  { name:'Anchor Blue',     hex:'#307FE2' },
  { name:'Link Pink',       hex:'#EB6FBD' },
  { name:'Open Mint',       hex:'#47D7AC' },
  { name:'Signal Yellow',   hex:'#E3E935' },
  { name:'Bright Orange',   hex:'#EE5340' },
  { name:'Framework Gray',  hex:'#B2B4B2' },
  { name:'Light Concrete',  hex:'#D9D9D6' },
  { name:'White',           hex:'#FFFFFF' }
];
const AUS = [
  { name:'AUS Black',           hex:'#000000' },
  { name:'AUS Corporate Red',   hex:'#983222' },
  { name:'CAAD Accent',         hex:'#9DABE2' },
  { name:'CAS Accent',          hex:'#988642' },
  { name:'CEN Accent',          hex:'#DF7A00' },
  { name:'SBA Accent',          hex:'#8BA69C' },
  { name:'AUS Gray',            hex:'#4D4F53' },
  { name:'White',               hex:'#FFFFFF' },
  { name:'Transparent',         hex:null }
];

/* ============================================================================
   geometry — pure
   ========================================================================= */
function cellGeometry(t, p) {
  if (p.mode === 'bw') {
    if (t < p.threshold) return null;
    return { bg: B_MM, bgStroke: BG_STROKE_PT * PT_MM, fg: FG_MAX_MM, fgStroke: FG_STROKE_PT * PT_MM };
  }
  if (t < T_MIN) return null;
  const bg = t >= BG_TAPER_T ? B_MM : B_MM * (t / BG_TAPER_T);
  return { bg, bgStroke: BG_STROKE_PT * PT_MM, fg: FG_MAX_MM * t, fgStroke: FG_STROKE_PT * PT_MM };
}
function squareSize(t, p) {
  const max = squareMax(p.squareFlush);
  if (p.mode === 'bw') return t < p.threshold ? 0 : max;
  return t < T_MIN ? 0 : max * t;
}
const gridLongFrom = (gridShort, srcShort, srcLong) =>
  Math.max(1, Math.round(gridShort * srcLong / srcShort));

/* Thinnest ink feature in mm for the current settings — drives PNG sizing. */
const SQ_FEATURE_T = 0.25;         // squares lighter than this are specks; ignore
function thinnestFeatureMM(params) {
  if (params.glyph === 'square') {
    const max = squareMax(params.squareFlush);
    return params.mode === 'bw' ? max : max * SQ_FEATURE_T;
  }
  return BG_STROKE_PT * PT_MM;      // the 0.25pt lattice hairline
}

/* ============================================================================
   sampler — pure
   ========================================================================= */
const SRGB_TO_LIN = new Float32Array(256);
for (let i = 0; i < 256; i++) {
  const c = i / 255;
  SRGB_TO_LIN[i] = c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
}
const linToSrgb = v => v <= 0.0031308 ? v * 12.92 : 1.055 * Math.pow(v, 1 / 2.4) - 0.055;

/* Rec. 709 luminance on linearised sRGB. Alpha composited over white. */
function decodeSource(imageData) {
  const { width: w, height: h, data } = imageData;
  const lin = new Float32Array(w * h);
  for (let i = 0, p = 0; i < lin.length; i++, p += 4) {
    const a = data[p + 3] / 255;
    const y = 0.2126 * SRGB_TO_LIN[data[p]] + 0.7152 * SRGB_TO_LIN[data[p + 1]] + 0.0722 * SRGB_TO_LIN[data[p + 2]];
    lin[i] = a === 1 ? y : y * a + (1 - a);
  }
  return { w, h, lin };
}

function downsample(src, gw, gh, region) {
  const { w, h, lin } = src;
  const rx = region ? region.x : 0, ry = region ? region.y : 0;
  const rw = region ? region.w : w,  rh = region ? region.h : h;
  const out = new Float32Array(gw * gh);
  for (let j = 0; j < gh; j++) {
    const y0 = ry + Math.floor(j * rh / gh);
    const y1 = Math.min(ry + rh, Math.max(y0 + 1, ry + Math.floor((j + 1) * rh / gh)));
    for (let i = 0; i < gw; i++) {
      const x0 = rx + Math.floor(i * rw / gw);
      const x1 = Math.min(rx + rw, Math.max(x0 + 1, rx + Math.floor((i + 1) * rw / gw)));
      let s = 0, n = 0;
      for (let y = y0; y < y1; y++) {
        const row = y * w;
        for (let x = x0; x < x1; x++) { s += lin[row + x]; n++; }
      }
      out[j * gw + i] = linToSrgb(s / n);
    }
  }
  return out;
}

function toneLUT({ brightness, contrast, gamma, invert }) {
  const k = contrast >= 0 ? (100 + contrast) / 100 : 100 / (100 - contrast);
  const lut = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) {
    let v = i / 1023;
    v = v + brightness / 100;
    v = (v - 0.5) * k + 0.5;
    v = Math.min(1, Math.max(0, v));
    v = Math.pow(v, 1 / gamma);
    if (invert) v = 1 - v;
    lut[i] = Math.min(1, Math.max(0, v));
  }
  return lut;
}
function applyTone(grid, lut) {
  const t = new Float32Array(grid.length);
  for (let i = 0; i < grid.length; i++) t[i] = 1 - lut[(grid[i] * 1023) | 0];
  return t;
}

/* ============================================================================
   glyph walk — one traversal, shared by canvas / svg / png
   ========================================================================= */
function buildPlus(t, gw, gh, params) {
  const buckets = new Map();
  const push = (sw, cx, cy, size) => {
    if (sw <= 0 || size <= 0) return;
    const key = Math.max(QUANT_MM, Math.round(sw / QUANT_MM) * QUANT_MM);
    let arr = buckets.get(key);
    if (!arr) buckets.set(key, arr = []);
    arr.push(cx, cy, size);
  };
  let drawn = 0;
  for (let j = 0; j < gh; j++) {
    for (let i = 0; i < gw; i++) {
      const g = cellGeometry(t[j * gw + i], params);
      if (!g) continue;
      drawn++;
      const cx = (i + 0.5) * PITCH, cy = (j + 0.5) * PITCH;
      push(g.bgStroke, cx, cy, g.bg);
      push(g.fgStroke, cx, cy, g.fg);
    }
  }
  return { buckets, drawn };
}
function buildSquares(t, gw, gh, params) {
  const cells = [];
  for (let j = 0; j < gh; j++) {
    for (let i = 0; i < gw; i++) {
      const s = squareSize(t[j * gw + i], params);
      if (s <= 0) continue;
      cells.push((i + 0.5) * SQ_CELL_MM, (j + 0.5) * SQ_CELL_MM, s);
    }
  }
  return { cells, drawn: cells.length / 3 };
}

/* ============================================================================
   render — mm to px, used by both the preview and the PNG export
   ========================================================================= */
function renderTo(ctx, t, gw, gh, params, opts) {
  const { scale, ink, paper, hairlineFloor } = opts;
  const pitch = pitchFor(params.glyph);
  if (paper) {
    ctx.fillStyle = paper;
    ctx.fillRect(0, 0, gw * pitch * scale, gh * pitch * scale);
  }
  if (params.glyph === 'square') {
    const { cells, drawn } = buildSquares(t, gw, gh, params);
    ctx.fillStyle = ink;
    // Snap to whole device pixels. In flush mode adjacent cells abut exactly,
    // and fractional edges would leave anti-aliased seams across solid areas.
    for (let k = 0; k < cells.length; k += 3) {
      const s = cells[k + 2] * scale, half = s / 2;
      const x0 = Math.round(cells[k] * scale - half);
      const y0 = Math.round(cells[k + 1] * scale - half);
      const x1 = Math.round(cells[k] * scale + half);
      const y1 = Math.round(cells[k + 1] * scale + half);
      ctx.fillRect(x0, y0, Math.max(1, x1 - x0), Math.max(1, y1 - y0));
    }
    return drawn;
  }
  ctx.strokeStyle = ink;
  ctx.lineCap = 'butt';
  const { buckets, drawn } = buildPlus(t, gw, gh, params);
  for (const [sw, cells] of buckets) {
    const path = new Path2D();
    for (let k = 0; k < cells.length; k += 3) {
      const cx = cells[k] * scale, cy = cells[k + 1] * scale, half = cells[k + 2] * scale / 2;
      path.moveTo(cx - half, cy); path.lineTo(cx + half, cy);
      path.moveTo(cx, cy - half); path.lineTo(cx, cy + half);
    }
    ctx.lineWidth = hairlineFloor ? Math.max(sw * scale, hairlineFloor) : sw * scale;
    ctx.stroke(path);
  }
  return drawn;
}

/* ============================================================================
   svg — export string, true millimetres
   ========================================================================= */
function buildSVG(t, gw, gh, params) {
  const pitch = pitchFor(params.glyph);
  const wmm = +(gw * pitch).toFixed(3), hmm = +(gh * pitch).toFixed(3);
  const ink = params.ink;
  const head = '<?xml version="1.0" encoding="UTF-8"?>';
  const open = attrs =>
    `<svg xmlns="http://www.w3.org/2000/svg" width="${wmm}mm" height="${hmm}mm" ` +
    `viewBox="0 0 ${wmm} ${hmm}" ${attrs}>`;
  const bgRect = params.paper
    ? `<rect x="0" y="0" width="${wmm}" height="${hmm}" fill="${params.paper}" stroke="none"/>`
    : '';

  if (params.glyph === 'square') {
    const { cells } = buildSquares(t, gw, gh, params);
    const out = [head, open(`fill="${ink}" stroke="none"`)];
    if (bgRect) out.push(bgRect);
    for (let k = 0; k < cells.length; k += 3) {
      const s = cells[k + 2], half = s / 2;
      out.push(`<rect x="${(cells[k] - half).toFixed(3)}" y="${(cells[k + 1] - half).toFixed(3)}" ` +
               `width="${s.toFixed(3)}" height="${s.toFixed(3)}"/>`);
    }
    out.push('</svg>');
    return out.join('\n');
  }

  const { buckets } = buildPlus(t, gw, gh, params);
  const out = [head, open(`fill="none" stroke="${ink}" stroke-linecap="butt"`)];
  if (bgRect) out.push(bgRect);
  const keys = [...buckets.keys()].sort((a, b) => a - b);
  for (const sw of keys) {
    const cells = buckets.get(sw), d = [];
    for (let k = 0; k < cells.length; k += 3) {
      const half = cells[k + 2] / 2, cx = cells[k], cy = cells[k + 1];
      d.push(`M${(cx - half).toFixed(3)} ${cy.toFixed(3)}h${(half * 2).toFixed(3)}`);
      d.push(`M${cx.toFixed(3)} ${(cy - half).toFixed(3)}v${(half * 2).toFixed(3)}`);
    }
    out.push(`<g stroke-width="${sw.toFixed(4)}"><path d="${d.join('')}"/></g>`);
  }
  out.push('</svg>');
  return out.join('\n');
}

/* ============================================================================
   png — resolution derived from the thinnest ink feature, not a DPI field
   ========================================================================= */
function pngPlan(gw, gh, params, intent) {
  const pitch = pitchFor(params.glyph);
  const wmm = gw * pitch, hmm = gh * pitch;
  const feature = thinnestFeatureMM(params);
  let scale = intent === 'max'
    ? PNG_MAX_PX / Math.max(wmm, hmm)
    : PNG_DPI[intent] / 25.4;
  let w = Math.round(wmm * scale), h = Math.round(hmm * scale);
  let clamped = false;
  if (Math.max(w, h) > PNG_MAX_PX) {
    const f = PNG_MAX_PX / Math.max(w, h);
    w = Math.max(1, Math.round(w * f)); h = Math.max(1, Math.round(h * f));
    scale = w / wmm; clamped = true;
  }
  w = Math.max(1, w); h = Math.max(1, h);
  const featurePx = feature * scale;
  return { w, h, scale, wmm, hmm, dpi: scale * 25.4, featurePx, clamped, soft: featurePx < PNG_SOFT_PX };
}

/* ============================================================================
   colour helpers
   ========================================================================= */
function relLum(hex) {
  const n = parseInt(hex.slice(1), 16);
  const f = i => SRGB_TO_LIN[(n >> i) & 255];
  return 0.2126 * f(16) + 0.7152 * f(8) + 0.0722 * f(0);
}
/* Value distance in linear light — enough to tell "will this vanish?". */
function paletteContrast(inkHex, paperHex) {
  if (!paperHex) return 1;                     // transparent: always legible
  return Math.abs(relLum(inkHex) - relLum(paperHex));
}

/* ============================================================================
   UI
   ========================================================================= */
const $ = id => document.getElementById(id);
const state = {
  src:null, name:'', gridShort:0, scaleMode:'pct',
  glyph:'plus', squareFlush:false,
  mode:'gray', threshold:0.5,
  brightness:0, contrast:0, gamma:1, invert:false,
  ink:'#1E2021', inkName:'Core Black',
  paper:'#FFFFFF', paperName:'White',
  pngIntent:'print',
  grid:null, gw:0, gh:0, t:null, capped:false
};

/* --- swatches --- */
function buildSwatches(el, list, kind) {
  el.innerHTML = '';
  list.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.hex = c.hex === null ? '' : c.hex;
    b.dataset.name = c.name;
    b.title = c.name;
    b.setAttribute('aria-label', c.name);
    if (c.hex === null) b.classList.add('transparent');
    else b.style.background = c.hex;
    b.setAttribute('aria-pressed', 'false');
    b.onclick = () => pick(kind, c.name, c.hex);
    el.appendChild(b);
  });
}
function pick(kind, name, hex) {
  if (kind === 'ink') {
    if (hex === null) return;                  // ink can't be transparent
    state.ink = hex; state.inkName = name;
  } else {
    state.paper = hex; state.paperName = name;
  }
  syncSwatches();
  draw();
}
function syncSwatches() {
  $('inkName').textContent = state.inkName;
  $('bgName').textContent = state.paperName;
  document.querySelectorAll('#inkCore button, #inkAus button').forEach(b => {
    const hex = b.dataset.hex || null;
    b.setAttribute('aria-pressed', String(hex === state.ink));
    b.disabled = hex === null;
  });
  document.querySelectorAll('#bgCore button, #bgAus button').forEach(b => {
    const hex = b.dataset.hex || null;
    b.setAttribute('aria-pressed', String(hex === state.paper));
  });
  const c = paletteContrast(state.ink, state.paper);
  const weak = c < CONTRAST_MIN;
  $('contrastNotice').hidden = !weak;
  if (weak) $('contrastNotice').textContent =
    `${state.inkName} on ${state.paperName} is very low contrast. The raster may be hard to read.`;
}

/* --- image loading --- */
function loadFile(file, label) {
  const ok = ['image/png','image/jpeg','image/webp','image/svg+xml'];
  $('fileError').hidden = true;
  if (!file) return;
  const name = label || file.name || 'pasted-image.png';
  if (!ok.includes(file.type)) {
    $('fileError').hidden = false;
    $('fileError').textContent = `${name} isn't a supported image. Use PNG, JPEG, WebP, or SVG.`;
    return;
  }
  const img = new Image();
  const reader = new FileReader();
  img.onload = () => {
    let w = img.naturalWidth || 1024;
    let h = img.naturalHeight || 1024;
    const cap = 4000;
    if (Math.max(w, h) > cap) { const s = cap / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const cx = c.getContext('2d', { willReadFrequently: true });
    cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h);
    cx.drawImage(img, 0, 0, w, h);
    state.src = decodeSource(cx.getImageData(0, 0, w, h));
    state.name = name.replace(/\.[^.]+$/, '');

    $('filemeta').hidden = false;
    $('filemeta').innerHTML = `<b>${name}</b><br>${w} &#215; ${h} px`;
    $('emptyState').hidden = true;
    $('preview').hidden = false;
    $('exportSvg').disabled = false;
    $('exportPng').disabled = false;
    $('scale').disabled = false;
    $('scaleWrap').classList.remove('disabled');

    state.gridShort = Math.max(1, Math.round(Math.min(w, h) * 0.25));
    syncScaleSlider();
    resample();
  };
  const fail = () => {
    $('fileError').hidden = false;
    $('fileError').textContent = `Couldn't decode ${name}. The file may be damaged or unsupported.`;
  };
  img.onerror = fail;
  reader.onerror = fail;
  reader.onload = () => { img.src = reader.result; };
  reader.readAsDataURL(file);
}

/* --- scale --- */
function srcShort(){ return state.src ? Math.min(state.src.w, state.src.h) : 1; }
function srcLong(){ return state.src ? Math.max(state.src.w, state.src.h) : 1; }

function syncScaleSlider() {
  const s = $('scale'), short = srcShort();
  if (state.scaleMode === 'pct') {
    s.min = 5; s.max = 100; s.step = 1;
    let pct = Math.round(state.gridShort / short * 100);
    pct = Math.min(100, Math.max(5, pct));
    if (Math.round(short * pct / 100) < state.gridShort) pct++;
    s.value = Math.min(100, pct);
    state.gridShort = Math.max(1, Math.round(short * s.value / 100));
  } else {
    s.min = Math.max(1, Math.round(short * 0.01)); s.max = short; s.step = 1;
    s.value = Math.min(short, Math.max(+s.min, state.gridShort));
    state.gridShort = +s.value;
  }
  fillTrack(s);
  updateScaleReadout();
}
function requestedGrid() {
  const gs = state.gridShort;
  const gl = gridLongFrom(gs, srcShort(), srcLong());
  const portrait = state.src && state.src.h < state.src.w;
  return portrait ? { w: gl, h: gs } : { w: gs, h: gl };
}
function effectiveGrid() {
  const req = requestedGrid();
  const short = Math.min(req.w, req.h);
  state.capped = short > MAX_GRID_SHORT;
  if (!state.capped) return req;
  const f = MAX_GRID_SHORT / short;
  return { w: Math.max(1, Math.round(req.w * f)), h: Math.max(1, Math.round(req.h * f)) };
}
function updateScaleReadout() {
  if (!state.src) return;
  const req = requestedGrid(), eff = effectiveGrid();
  const pct = state.gridShort / srcShort() * 100;
  $('scaleOut').innerHTML = state.scaleMode === 'pct'
    ? `${$('scale').value}% <em>&#8594;</em> ${req.w} &#215; ${req.h} units`
    : `${state.gridShort} units <em>&#8594;</em> ${req.w} &#215; ${req.h} units <em>(${pct.toFixed(1)}%)</em>`;
  $('capNotice').hidden = !state.capped;
  if (state.capped) $('capNotice').textContent =
    `Capped at ${MAX_GRID_SHORT} units on the short side. Rendering ${eff.w} \u00D7 ${eff.h}.`;
}

/* --- pipeline --- */
let timer = null;
function resample() {
  if (!state.src) return;
  const g = effectiveGrid();
  state.gw = g.w; state.gh = g.h;
  state.grid = downsample(state.src, g.w, g.h, null);
  retone();
}
function resampleDebounced(){ clearTimeout(timer); timer = setTimeout(resample, 100); }
function retone() {
  if (!state.grid) return;
  state.t = applyTone(state.grid, toneLUT(state));
  draw();
}
function params() {
  return {
    glyph: state.glyph, squareFlush: state.squareFlush,
    mode: state.mode, threshold: state.threshold,
    ink: state.ink, paper: state.paper
  };
}
function draw() {
  if (!state.t) return;
  const p = params();
  const vp = document.querySelector('.viewport');
  const pitch = pitchFor(state.glyph);
  const wmm = state.gw * pitch, hmm = state.gh * pitch;
  const fit = Math.min((vp.clientWidth - 64) / wmm, (vp.clientHeight - 64) / hmm);
  const scale = Math.max(0.2, fit);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const cv = $('preview');
  cv.width = Math.round(wmm * scale * dpr);
  cv.height = Math.round(hmm * scale * dpr);
  cv.style.width = (wmm * scale) + 'px';
  cv.style.height = (hmm * scale) + 'px';
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, wmm * scale, hmm * scale);

  const drawn = renderTo(ctx, state.t, state.gw, state.gh, p, {
    scale, ink: state.ink,
    paper: state.paper || '#FFFFFF',   // preview always needs something behind it
    hairlineFloor: 0.35
  });

  $('statGrid').innerHTML = `Grid <b>${state.gw} &#215; ${state.gh}</b>`;
  $('statBoard').innerHTML = `Board <b>${wmm.toFixed(0)} &#215; ${hmm.toFixed(0)} mm</b>`;
  $('statCells').innerHTML = `Cells <b>${drawn.toLocaleString()}</b> / ${(state.gw * state.gh).toLocaleString()}`;
  updatePngReadout();
}
function updatePngReadout() {
  if (!state.t) return;
  const plan = pngPlan(state.gw, state.gh, params(), state.pngIntent);
  $('pngOut').innerHTML =
    `${plan.w.toLocaleString()} &#215; ${plan.h.toLocaleString()} px <em>&#183;</em> ${Math.round(plan.dpi)} dpi ` +
    `<em>at ${plan.wmm.toFixed(0)} &#215; ${plan.hmm.toFixed(0)} mm</em>`;
  const soft = plan.soft;
  $('stageNotice').hidden = !soft;
  if (soft) $('stageNotice').textContent =
    `Thinnest ink lands on ${plan.featurePx.toFixed(2)} px at this size, so the PNG will soften. ` +
    `Export SVG for full detail\u2014 it stays sharp at any size.`;
}

/* --- slider fill --- */
function fillTrack(input) {
  const min = +input.min, max = +input.max, v = +input.value;
  const pct = max === min ? 0 : (v - min) / (max - min) * 100;
  input.parentElement.style.setProperty('--fill', pct + '%');
}
document.querySelectorAll('.slider input[type=range]').forEach(i => {
  fillTrack(i);
  i.addEventListener('input', () => fillTrack(i));
});

/* --- controls --- */
function segment(id, onPick) {
  const el = $(id);
  el.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    [...el.children].forEach(c => c.setAttribute('aria-pressed', String(c === b)));
    onPick(b.dataset.v);
  };
}
segment('glyphMode', v => {
  state.glyph = v;
  $('flushField').hidden = v !== 'square';
  draw();
});
segment('mode', v => {
  state.mode = v;
  $('thresholdField').hidden = v !== 'bw';
  draw();
});
segment('scaleMode', v => { state.scaleMode = v; syncScaleSlider(); resampleDebounced(); });
segment('pngIntent', v => { state.pngIntent = v; updatePngReadout(); });

function switchToggle(id, key, after) {
  $(id).onclick = e => {
    state[key] = e.currentTarget.getAttribute('aria-pressed') !== 'true';
    e.currentTarget.setAttribute('aria-pressed', String(state[key]));
    after();
  };
}
switchToggle('squareFlush', 'squareFlush', draw);
switchToggle('invert', 'invert', retone);

$('scale').oninput = e => {
  state.gridShort = state.scaleMode === 'pct'
    ? Math.max(1, Math.round(srcShort() * +e.target.value / 100))
    : +e.target.value;
  updateScaleReadout();
  resampleDebounced();
};
$('threshold').oninput = e => {
  state.threshold = +e.target.value / 100;
  $('thresholdOut').textContent = e.target.value + '%';
  draw();
};
$('brightness').oninput = e => {
  state.brightness = +e.target.value;
  $('brightnessOut').textContent = (state.brightness > 0 ? '+' : '') + state.brightness;
  retone();
};
$('contrast').oninput = e => {
  state.contrast = +e.target.value;
  $('contrastOut').textContent = (state.contrast > 0 ? '+' : '') + state.contrast;
  retone();
};
const GMIN = Math.log(0.2), GMAX = Math.log(5);
$('gamma').oninput = e => {
  state.gamma = Math.exp(GMIN + (GMAX - GMIN) * (+e.target.value / 1000));
  $('gammaOut').textContent = state.gamma.toFixed(2);
  retone();
};

/* --- input --- */
const drop = $('drop');
drop.onclick = () => $('file').click();
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } };
$('file').onchange = e => loadFile(e.target.files[0]);
['dragenter','dragover'].forEach(ev => window.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.add('over');
}));
['dragleave','drop'].forEach(ev => window.addEventListener(ev, e => {
  e.preventDefault(); if (ev === 'drop' || e.target === document.body) drop.classList.remove('over');
}));
window.addEventListener('drop', e => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); });
window.addEventListener('paste', e => {
  const items = [...(e.clipboardData?.items || [])];
  const imageItem = items.find(i => i.kind === 'file' && i.type.startsWith('image/'));
  if (imageItem) {
    e.preventDefault();
    const blob = imageItem.getAsFile();
    const ext = (blob.type.split('/')[1] || 'png').replace('+xml', '');
    loadFile(blob, `pasted-image.${ext}`);
    return;
  }
  const textItem = items.find(i => i.kind === 'string' && i.type === 'text/plain');
  if (!textItem) return;
  textItem.getAsString(text => {
    const s = text.trim();
    if (!s.startsWith('<svg') && !s.startsWith('<?xml')) {
      $('fileError').hidden = false;
      $('fileError').textContent = 'That clipboard content has no image in it. Copy an image, then paste again.';
      return;
    }
    loadFile(new File([s], 'pasted.svg', { type: 'image/svg+xml' }), 'pasted.svg');
  });
});
window.addEventListener('resize', () => { clearTimeout(timer); timer = setTimeout(draw, 100); });

/* --- export --- */
function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function slug() {
  return `${state.name || 'raster'}-${state.glyph === 'square' ? 'grid' : 'node'}-raster`;
}
$('exportSvg').onclick = () => {
  download(new Blob([buildSVG(state.t, state.gw, state.gh, params())],
    { type: 'image/svg+xml' }), slug() + '.svg');
};
$('exportPng').onclick = () => {
  const p = params();
  const plan = pngPlan(state.gw, state.gh, p, state.pngIntent);
  const cv = document.createElement('canvas');
  cv.width = plan.w; cv.height = plan.h;
  const ctx = cv.getContext('2d');
  renderTo(ctx, state.t, state.gw, state.gh, p, {
    scale: plan.scale, ink: state.ink, paper: state.paper, hairlineFloor: 0
  });
  cv.toBlob(b => download(b, slug() + '.png'), 'image/png');
};

/* --- init --- */
buildSwatches($('inkCore'), CORE, 'ink');
buildSwatches($('inkAus'), AUS, 'ink');
buildSwatches($('bgCore'), CORE, 'bg');
buildSwatches($('bgAus'), AUS, 'bg');
syncSwatches();
</script>
</body>
</html>
